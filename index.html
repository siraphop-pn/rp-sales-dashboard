
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Dashboard - RP Sales</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for rendering charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Plugin Data Labels -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.05);
        }
        
        select[multiple] { scrollbar-width: thin; }
        select[multiple]::-webkit-scrollbar { width: 4px; }
        select[multiple]::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        select[multiple]::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 4px; }
        select[multiple]::-webkit-scrollbar-thumb:hover { background: #818cf8; }
        select[multiple] option:checked {
            background: linear-gradient(0deg, #e0e7ff 0%, #e0e7ff 100%);
            color: #4338ca; font-weight: 600;
        }
    </style>
</head>
<body class="p-2 md:p-4 text-sm">

    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- COMPACT Header & Controls -->
        <div class="glass-card rounded-xl p-3 flex flex-col lg:flex-row justify-between items-center gap-3">
            
            <div class="flex flex-row lg:flex-col items-center lg:items-start gap-2 w-full lg:w-auto">
                <h1 class="text-xl font-bold text-indigo-700 flex items-center whitespace-nowrap"><i class="fas fa-motorcycle mr-2"></i>RP Sales</h1>
                <p class="text-[10px] text-gray-500 font-semibold uppercase hidden lg:block">Summary 2567-2569</p>
            </div>
            
            <div class="flex flex-wrap lg:flex-nowrap gap-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-100 w-full lg:w-auto">
                
                <div class="flex flex-col">
                    
                <div class="flex items-center gap-2 px-2 border-r border-gray-200">
                    <input type="checkbox" id="showSale" checked class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="showSale" class="text-[10px] font-bold text-indigo-600 uppercase">Sale</label>
                </div>
                <div class="flex items-center gap-2 px-2 border-r border-gray-200">
                    <input type="checkbox" id="showDel" checked class="w-4 h-4 rounded border-gray-300 text-emerald-600 focus:ring-emerald-500">
                    <label for="showDel" class="text-[10px] font-bold text-emerald-600 uppercase">Del</label>
                </div>
<label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide mb-0.5">Year</label>
                    <select id="yearFilter" class="bg-indigo-50 border border-indigo-200 text-indigo-900 font-bold text-xs rounded focus:ring-indigo-500 focus:border-indigo-500 block w-24 p-1.5 shadow-sm">
                        <option value="All" selected>All</option>
                        <option value="2567">2567</option><option value="2568">2568</option><option value="2569">2569</option>
                    </select>
                </div>
                
                <div class="flex flex-col">
                    <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide mb-0.5">Time View</label>
                    <select id="timeViewFilter" class="bg-blue-50 border border-blue-200 text-blue-900 font-bold text-xs rounded focus:ring-blue-500 focus:border-blue-500 block w-28 p-1.5 shadow-sm">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly" selected>Monthly</option>
                        <option value="quarterly">Quarterly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
            
                <div class="flex flex-col">
                    <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide mb-0.5">Metric</label>
                    <select id="metricFilter" class="bg-indigo-50 border border-indigo-200 text-indigo-900 font-bold text-xs rounded focus:ring-indigo-500 focus:border-indigo-500 block w-24 p-1.5 shadow-sm">
                        <option value="units" selected>Units</option>
                        <option value="sales">Revenue</option>
                    </select>
                </div>

                <div class="flex flex-col relative group">
                    <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide mb-0.5">Model <span class="text-indigo-400 normal-case font-normal">(Ctrl+Click)</span></label>
                    <select id="modelFilter" multiple size="2" class="bg-white border border-gray-200 text-gray-800 text-xs rounded focus:ring-indigo-500 focus:border-indigo-500 block w-40 p-1 shadow-sm h-12">
                        <option value="All" selected>All Models</option>
                        <option value="ADV160">ADV160</option><option value="ADV350">ADV350</option><option value="CB150R">CB150R</option><option value="CBR150R">CBR150R</option><option value="CLICK125">CLICK125</option><option value="CLICK160">CLICK160</option><option value="CRF300L">CRF300L</option><option value="FORZA350">FORZA350</option><option value="GIORNO +">GIORNO +</option><option value="GROM">GROM</option><option value="LEAD125">LEAD125</option><option value="PCX160">PCX160</option><option value="SCOOPY">SCOOPY</option><option value="SUPER CUB">SUPER CUB</option><option value="WAVE110">WAVE110</option><option value="WAVE110i">WAVE110i</option><option value="WAVE125">WAVE125</option><option value="WAVE125i">WAVE125i</option><option value="ZOOMER-X">ZOOMER-X</option><option value="rebel300">rebel300</option>
                    </select>
                </div>
                
                <div class="flex flex-col relative group">
                    <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide mb-0.5">Color <span class="text-indigo-400 normal-case font-normal">(Ctrl+Click)</span></label>
                    <select id="colorFilter" multiple size="2" class="bg-white border border-gray-200 text-gray-800 text-xs rounded focus:ring-indigo-500 focus:border-indigo-500 block w-32 p-1 shadow-sm h-12">
                        <option value="All" selected>All Colors</option>
                        <option value="B-G">B-G</option><option value="B-R">B-R</option><option value="B-S">B-S</option><option value="B-W">B-W</option><option value="B-Y">B-Y</option><option value="BBR">BBR</option><option value="BGO">BGO</option><option value="BLK">BLK</option><option value="BLU">BLU</option><option value="BRB">BRB</option><option value="BRW">BRW</option><option value="BUB">BUB</option><option value="BUG">BUG</option><option value="BUW">BUW</option><option value="G-B">G-B</option><option value="G-R">G-R</option><option value="G-W">G-W</option><option value="GBR">GBR</option><option value="GBU">GBU</option><option value="GNB">GNB</option><option value="GRN">GRN</option><option value="GRY">GRY</option><option value="O-B">O-B</option><option value="R-B">R-B</option><option value="R-G">R-G</option><option value="R-S">R-S</option><option value="R-W">R-W</option><option value="RED">RED</option><option value="S-B">S-B</option><option value="SBB">SBB</option><option value="W-B">W-B</option><option value="W-G">W-G</option><option value="W-R">W-R</option><option value="WBR">WBR</option><option value="WBU">WBU</option><option value="WHT">WHT</option><option value="WPK">WPK</option><option value="Y-B">Y-B</option><option value="YEL">YEL</option>
                    </select>
                </div>

                <div class="flex flex-col h-full justify-end pb-1">
                    <button id="resetBtn" class="bg-red-50 text-red-600 hover:bg-red-100 font-semibold py-1.5 px-3 text-xs border border-red-200 rounded shadow-sm transition h-8">
                        <i class="fas fa-undo mr-1"></i>Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card rounded-xl p-4 border-l-4 border-emerald-500 flex items-center justify-between">
                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Total Units (จำนวนคัน)</h3>
                    <p id="kpiUnits" class="text-2xl font-extrabold text-emerald-600 mt-1">0</p>
                    <div id="kpiUnitsBreakdown" class="text-[10px] font-semibold text-emerald-600/70 mt-0.5 min-h-[1rem]"></div>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-xl">
                    <i class="fas fa-tags"></i>
                </div>
            </div>
            
            <div class="glass-card rounded-xl p-4 border-l-4 border-indigo-500 flex items-center justify-between">
                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Total Revenue (ยอดขายรวม)</h3>
                    <p id="kpiSales" class="text-2xl font-extrabold text-indigo-700 mt-1">฿0</p>
                    <div id="kpiSalesBreakdown" class="text-[10px] font-semibold text-indigo-700/70 mt-0.5 min-h-[1rem]"></div>
                </div>
                <div class="w-12 h-12 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center text-xl">
                    <i class="fas fa-wallet"></i>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            
            <!-- Trend Chart -->
            <div class="glass-card rounded-xl p-4 lg:col-span-3 shadow-sm">
                <h3 id="trendChartTitle" class="text-sm font-bold text-gray-700 mb-3 border-b pb-1.5"><i class="fas fa-chart-line mr-1.5 text-emerald-500"></i>Units Trend (แนวโน้มจำนวนรถที่ขาย)</h3>
                <div class="relative h-72">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            
            <!-- Top Models -->
            <div class="glass-card rounded-xl p-4 lg:col-span-2 shadow-sm">
                <h3 id="modelChartTitle" class="text-sm font-bold text-gray-700 mb-3 border-b pb-1.5"><i class="fas fa-trophy mr-1.5 text-yellow-500"></i>Top Models by Units (รุ่นที่ขายออกมากที่สุด)</h3>
                <div class="relative h-64">
                    <canvas id="modelChart"></canvas>
                </div>
            </div>

            <!-- Top Colors -->
            <div class="glass-card rounded-xl p-4 lg:col-span-1 shadow-sm">
                <h3 id="colorChartTitle" class="text-sm font-bold text-gray-700 mb-3 border-b pb-1.5"><i class="fas fa-palette mr-1.5 text-pink-500"></i>Top Colors by Units (สีที่ขายออกมากที่สุด)</h3>
                <div class="relative h-64">
                    <canvas id="colorChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <!-- Application Logic -->
    
<script>
    Chart.register(ChartDataLabels);
    let rawData = [];
    let trendChartInstance = null;
    let colorChartInstance = null;
    let modelChartInstance = null;

    const formatMoney = (amount) => new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(amount);
    const formatNum = (num) => new Intl.NumberFormat('th-TH').format(num);
    const getSelectedValues = (id) => Array.from(document.getElementById(id).selectedOptions).map(opt => opt.value);

    async function init() {
        const response = await fetch('data.json');
        rawData = await response.json();
        updateDashboard();
    }

    const updateDashboard = () => {
        const selectedYear = document.getElementById('yearFilter').value;
        const selectedMetric = document.getElementById('metricFilter').value;
        const selectedTimeView = document.getElementById('timeViewFilter').value;
        const selectedModels = getSelectedValues('modelFilter');
        const selectedColors = getSelectedValues('colorFilter');
        const isSales = selectedMetric === 'sales';
        const showSale = document.getElementById('showSale').checked;
        const showDel = document.getElementById('showDel').checked;

        const filteredData = rawData.filter(d => {
            let mYear = (selectedYear === 'All') || (d.year === selectedYear);
            let mModel = selectedModels.includes('All') || selectedModels.includes(d.model);
            let mColor = selectedColors.includes('All') || selectedColors.includes(d.color);
            let mType = (showSale && d.type === 'Sale') || (showDel && d.type === 'Delivery');
            return mYear && mModel && mColor && mType;
        });

        document.getElementById('kpiSales').innerText = formatMoney(filteredData.reduce((s, d) => s + d.sales, 0));
        document.getElementById('kpiUnits').innerText = formatNum(filteredData.reduce((s, d) => s + d.units, 0)) + ' คัน';

        const periods = Array.from(new Set(filteredData.map(d => d[selectedTimeView]))).sort();
        const years = Array.from(new Set(filteredData.map(d => d.year))).sort();
        
        let trendDatasets = [];
        const typeColors = { 'Sale': '#6366f1', 'Delivery': '#10b981' };
        ['Sale', 'Delivery'].forEach(type => {
            if ((type==='Sale' && !showSale) || (type==='Delivery' && !showDel)) return;
            years.forEach(yr => {
                const data = periods.map(p => {
                    const val = filteredData.filter(d => d.type === type && d.year === yr && d[selectedTimeView] === p).reduce((s, d) => s + (isSales?d.sales:d.units), 0);
                    return val || 0;
                });
                trendDatasets.push({
                    label: ,
                    data: data,
                    borderColor: typeColors[type],
                    borderDash: type === 'Delivery' ? [5, 5] : [],
                    fill: false, tension: 0.3
                });
            });
        });

        if(trendChartInstance) trendChartInstance.destroy();
        trendChartInstance = new Chart(document.getElementById('trendChart'), {
            type: 'line', data: { labels: periods, datasets: trendDatasets },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
        });

        const topModels = Array.from(new Set(filteredData.map(d => d.model))).slice(0, 15);
        let modelDatasets = [];
        ['Sale', 'Delivery'].forEach(type => {
            if ((type==='Sale' && !showSale) || (type==='Delivery' && !showDel)) return;
            years.forEach(yr => {
                modelDatasets.push({
                    label: ,
                    backgroundColor: type === 'Sale' ? '#6366f1' : '#10b981',
                    data: topModels.map(m => filteredData.filter(d => d.type === type && d.year === yr && d.model === m).reduce((s, d) => s + (isSales?d.sales:d.units), 0))
                });
            });
        });

        if(modelChartInstance) modelChartInstance.destroy();
        modelChartInstance = new Chart(document.getElementById('modelChart'), {
            type: 'bar', data: { labels: topModels, datasets: modelDatasets },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
        });
    };

    ['yearFilter', 'metricFilter', 'timeViewFilter', 'modelFilter', 'colorFilter', 'showSale', 'showDel'].forEach(id => {
        document.getElementById(id).addEventListener('change', updateDashboard);
    });
    
    init();
</script>

    <!-- Chart.js for rendering charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
