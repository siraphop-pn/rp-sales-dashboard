        const formatMoney = (amount) => {
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(amount);
        };
        const formatNum = (num) => {
            return new Intl.NumberFormat('th-TH').format(num);
        };

        const groupBy = (data, key) => {
            return data.reduce((acc, curr) => {
                let k = curr[key];
                if (!k) k = "Unknown";
                if (!acc[k]) {
                    acc[k] = { sales: 0, units: 0 };
                }
                acc[k].sales += curr.sales;
                acc[k].units += curr.units;
                return acc;
            }, {});
        };

        const getSelectedValues = (selectId) => {
            const select = document.getElementById(selectId);
            return Array.from(select.selectedOptions).map(opt => opt.value);
        };

        const handleMultiSelectLogic = (e) => {
            const select = e.target;
            const selectedVals = Array.from(select.selectedOptions).map(o => o.value);
            
            if (e.target.value === 'All' && selectedVals.length > 1) {
                Array.from(select.options).forEach(opt => {
                    if (opt.value !== 'All') opt.selected = false;
                });
            } else if (selectedVals.includes('All') && selectedVals.length > 1) {
                Array.from(select.options).find(opt => opt.value === 'All').selected = false;
            }
            
            if (select.selectedOptions.length === 0) {
                Array.from(select.options).find(opt => opt.value === 'All').selected = true;
            }
            
            updateDashboard();
        };

            if (selectedTimeView === "weekly") timeText = "(รายสัปดาห์)";
            if (selectedTimeView === "monthly") timeText = "(รายเดือน)";
            if (selectedTimeView === "quarterly") timeText = "(รายไตรมาส)";
            if (selectedTimeView === "yearly") timeText = "(รายปี)";

            document.getElementById('trendChartTitle').innerHTML = isSales ? 
                '<i class="fas fa-chart-line mr-1.5 text-indigo-500"></i>Revenue Trend ' + timeText + ' - แนวโน้มยอดขาย' : 
                '<i class="fas fa-chart-line mr-1.5 text-emerald-500"></i>Units Trend ' + timeText + ' - แนวโน้มจำนวนรถที่ขาย';
                
            document.getElementById('colorChartTitle').innerHTML = isSales ? 
                '<i class="fas fa-palette mr-1.5 text-pink-500"></i>Top Colors by Revenue (สีที่สร้างยอดขายสูงสุด)' : 
                '<i class="fas fa-palette mr-1.5 text-pink-500"></i>Top Colors by Units (สีที่ขายออกมากที่สุด)';

            document.getElementById('modelChartTitle').innerHTML = isSales ? 
                '<i class="fas fa-trophy mr-1.5 text-yellow-500"></i>Top Models by Revenue (รุ่นที่สร้างยอดขายสูงสุด)' : 
                '<i class="fas fa-trophy mr-1.5 text-yellow-500"></i>Top Models by Units (รุ่นที่ขายออกมากที่สุด)';

            const tooltipCallbackMultiLine = function(context) {
                let label = context.dataset.label || '';
                if (label) { label += ': '; }
                if (context.parsed.y !== null && context.chart.config.type !== 'bar' || context.chart.config.options.indexAxis !== 'y') {
                    let val = context.parsed.y !== undefined ? context.parsed.y : context.parsed.x;
                    if(isSales) {
                        label += new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(val);
                    } else {
                        label += new Intl.NumberFormat('th-TH').format(val) + ' คัน';
                    }
                }
                return label;
            };
            
            const tooltipCallbackBar = function(context) {
                let label = context.dataset.label || '';
                if (label) { label += ': '; }
                
                let val = context.chart.config.options.indexAxis === 'y' ? context.parsed.x : context.parsed.y;
                
                if (val !== undefined && val !== null) {
                    let formattedVal = isSales ? new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(val) : new Intl.NumberFormat('th-TH').format(val) + ' คัน';
                    
                    let total = context.dataset.metaTotal;
                    if (total && total > 0) {
                        let pct = ((val / total) * 100).toFixed(1) + '%';
                        formattedVal += ' (' + pct + ')';
                    }
                    label += formattedVal;
                }
                return label;
            };

            let trendLabels = [];
            let trendDatasets = [];
            
            const colorPalette = ['#3b82f6', '#f59e0b', '#10b981', '#f43f5e', '#8b5cf6', '#0ea5e9'];
            const bgPalette = ['rgba(59, 130, 246, 0.1)', 'rgba(245, 158, 11, 0.1)', 'rgba(16, 185, 129, 0.1)', 'rgba(244, 63, 94, 0.1)', 'rgba(139, 92, 246, 0.1)', 'rgba(14, 165, 233, 0.1)'];

            if (selectedTimeView === 'yearly') {
                const timeGroup = groupBy(filteredData, 'yearly');
                trendLabels = Object.keys(timeGroup).sort();
                const dataPts = trendLabels.map(t => isSales ? timeGroup[t].sales : timeGroup[t].units);
                trendDatasets.push({
                    label: isSales ? 'Revenue (฿)' : 'Units (คัน)',
                    data: dataPts,
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                    borderWidth: 2,
                    pointRadius: 4,
                    fill: true,
                    tension: 0.3
                });
            } else {
                const periodsSet = new Set();
                const yearsSet = new Set();
                
                filteredData.forEach(d => {
                    if (d[selectedTimeView]) periodsSet.add(d[selectedTimeView]);
                    if (d.year) yearsSet.add(d.year);
                });
                
                trendLabels = Array.from(periodsSet).sort();
                const sortedYears = Array.from(yearsSet).sort();
                
                sortedYears.forEach((yr, idx) => {
                    const yearData = filteredData.filter(d => d.year === yr);
                    const timeGroup = groupBy(yearData, selectedTimeView);
                    
                    const dataPts = trendLabels.map(t => {
                        const existsInRaw = rawData.some(r => r.year === yr && r[selectedTimeView] === t);
                        if (!existsInRaw) return null;
                        return timeGroup[t] ? (isSales ? timeGroup[t].sales : timeGroup[t].units) : 0;
                    });

                    trendDatasets.push({
                        label: ' ปี ' + yr + (isSales ? ' (Revenue)' : ' (Units)'),
                        data: dataPts,
                        borderColor: colorPalette[idx % colorPalette.length],
                        backgroundColor: bgPalette[idx % bgPalette.length],
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: colorPalette[idx % colorPalette.length],
                        pointRadius: (selectedTimeView === 'daily') ? 0 : 4,
                        fill: false,
                        tension: 0.3,
                        spanGaps: false
                    });
                });
            }

            const uniqueYears = Array.from(new Set(filteredData.map(d => d.year))).sort();

            const overallModelGroup = groupBy(filteredData, 'model');
            const topModelKeys = Object.keys(overallModelGroup)
                .map(k => ({ model: k, val: isSales ? overallModelGroup[k].sales : overallModelGroup[k].units }))
                .sort((a, b) => b.val - a.val)
                .slice(0, 15)
                .map(item => item.model);

            let modelDatasets = [];
            uniqueYears.forEach((yr, idx) => {
                const yearData = filteredData.filter(d => d.year === yr);
                const modelGroup = groupBy(yearData, 'model');
                
                const yearTotal = yearData.reduce((sum, d) => sum + (isSales ? d.sales : d.units), 0);
                
                const dataPts = topModelKeys.map(m => {
                    return modelGroup[m] ? (isSales ? modelGroup[m].sales : modelGroup[m].units) : 0;
                });
                
                modelDatasets.push({
                    label: 'ปี ' + yr,
                    data: dataPts,
                    backgroundColor: colorPalette[idx % colorPalette.length],
                    borderRadius: 4,
                    metaTotal: yearTotal
                });
            });

            const overallColorGroup = groupBy(filteredData, 'color');
            const topColorKeys = Object.keys(overallColorGroup)
                .map(k => ({ color: k, val: isSales ? overallColorGroup[k].sales : overallColorGroup[k].units }))
                .sort((a, b) => b.val - a.val)
                .slice(0, 10)
                .map(item => item.color);

            let colorDatasets = [];
            uniqueYears.forEach((yr, idx) => {
                const yearData = filteredData.filter(d => d.year === yr);
                const colorGroup = groupBy(yearData, 'color');
                
                const yearTotal = yearData.reduce((sum, d) => sum + (isSales ? d.sales : d.units), 0);
                
                const dataPts = topColorKeys.map(c => {
                    return colorGroup[c] ? (isSales ? colorGroup[c].sales : colorGroup[c].units) : 0;
                });
                
                colorDatasets.push({
                    label: 'ปี ' + yr,
                    data: dataPts,
                    backgroundColor: colorPalette[idx % colorPalette.length],
                    borderRadius: 4,
                    metaTotal: yearTotal
                });
            });

            const trendCtx = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: trendLabels,
                    datasets: trendDatasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { top: 20 } // Add some padding so labels don't get cut off
                    },
                    plugins: { 
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: {size: 10} } },
                        tooltip: { callbacks: { label: tooltipCallbackMultiLine } },
                        datalabels: {
                            display: function(context) {
                                // Display label only if screen > 768px (Tablet/Desktop) AND value is > 0 
                                // ALSO skip labels if we're in daily view because there are too many data points
                                const isDesktop = window.innerWidth > 768;
                                const isNotDaily = selectedTimeView !== 'daily';
                                const value = context.dataset.data[context.dataIndex];
                                return isDesktop && isNotDaily && value !== null && value !== 0;
                            },
                            align: 'top',
                            offset: 4,
                            color: function(context) {
                                return context.dataset.borderColor;
                            },
                            font: {
                                size: 10,
                                weight: 'bold'
                            },
                            formatter: function(value, context) {
                                if(isSales) {
                                    if(value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                                    return (value / 1000).toFixed(0) + 'k';
                                } else {
                                    return new Intl.NumberFormat('th-TH').format(value);
                                }
                            }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { font: {size: 10}, callback: value => isSales ? '฿' + (value/1000).toLocaleString() + 'k' : formatNum(value) } 
                        },
                        x: { ticks: { font: {size: 10}, maxTicksLimit: (selectedTimeView === 'daily') ? 15 : null } }
                    }
                }
            });

            const modelCtx = document.getElementById('modelChart').getContext('2d');
            if (modelChartInstance) modelChartInstance.destroy();
            modelChartInstance = new Chart(modelCtx, {
                type: 'bar',
                data: {
                    labels: topModelKeys,
                    datasets: modelDatasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: {size: 10} } },
                        tooltip: { callbacks: { label: tooltipCallbackBar } },
                        datalabels: { display: false } // Disable labels here
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { font: {size: 10}, callback: value => isSales ? '฿' + (value/1000000).toLocaleString() + 'M' : formatNum(value) } 
                        },
                        x: { ticks: { font: {size: 9}, maxRotation: 45, minRotation: 45 } }
                    }
                }
            });

            const colorCtx = document.getElementById('colorChart').getContext('2d');
            if (colorChartInstance) colorChartInstance.destroy();
            colorChartInstance = new Chart(colorCtx, {
                type: 'bar',
                data: {
                    labels: topColorKeys,
                    datasets: colorDatasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { 
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: {size: 10} } },
                        tooltip: { callbacks: { label: tooltipCallbackBar } },
                        datalabels: { display: false } // Disable labels here
                    },
                    scales: {
                        x: { 
                            beginAtZero: true, 
                            ticks: { font: {size: 10}, callback: value => isSales ? '฿' + (value/1000000).toLocaleString() + 'M' : formatNum(value) } 
                        },
                        y: { ticks: { font: {size: 10} } }
                    }
                }
            });
        };

        // Listen for window resize to re-evaluate datalabels display condition
        window.addEventListener('resize', () => {
            if (trendChartInstance) {
                trendChartInstance.update();
            }
        });

        
        document.getElementById("showSale").addEventListener("change", updateDashboard);
        document.getElementById("showDel").addEventListener("change", updateDashboard);
        document.getElementById('showSale').addEventListener('change', updateDashboard);
        document.getElementById('showDel').addEventListener('change', updateDashboard);
        document.getElementById('yearFilter').addEventListener('change', updateDashboard);
        document.getElementById('metricFilter').addEventListener('change', updateDashboard);
        document.getElementById('timeViewFilter').addEventListener('change', updateDashboard);
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('yearFilter').value = 'All';
            document.getElementById('timeViewFilter').value = 'monthly';
            document.getElementById('metricFilter').value = 'units';
            
            const modelSelect = document.getElementById('modelFilter');
            Array.from(modelSelect.options).forEach(opt => opt.selected = false);
            modelSelect.options[0].selected = true;
            
            const colorSelect = document.getElementById('colorFilter');
            Array.from(colorSelect.options).forEach(opt => opt.selected = false);
            colorSelect.options[0].selected = true;

            updateDashboard();
        });

        updateDashboard();
    setTimeout(updateDashboard, 100);
</script>
</body>
</html>
