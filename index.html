                            pointBackgroundColor: '#fff',
                            pointBorderColor: color,
                            pointRadius: (selectedTimeView === 'daily') ? 0 : 4,
                            fill: false,
                            tension: 0.3,
                            spanGaps: false
                        });
                    });
                });
            }

            const uniqueYears = Array.from(new Set(activeData.map(d => d.year))).sort();

            // 3.2 Top Models
            const overallModelGroup = groupBy(activeData, 'model');
            const topModelKeys = Object.keys(overallModelGroup)
                .map(k => ({ model: k, val: isSalesMetric ? overallModelGroup[k].sales : overallModelGroup[k].units }))
                .sort((a, b) => b.val - a.val)
                .slice(0, 15)
                .map(item => item.model);

            let modelDatasets = [];
            uniqueYears.forEach((yr, idx) => {
                dataTypesToShow.forEach(dtStr => {
                    const subData = activeData.filter(d => d.year === yr && d.dataType === dtStr);
                    const modelGroup = groupBy(subData, 'model');
                    const yearTotal = subData.reduce((sum, d) => sum + (isSalesMetric ? d.sales : d.units), 0);
                    
                    const dataPts = topModelKeys.map(m => modelGroup[m] ? (isSalesMetric ? modelGroup[m].sales : modelGroup[m].units) : 0);
                    let bgColor = dtStr === 'Delivery' ? lightPalette[idx % lightPalette.length] : colorPalette[idx % colorPalette.length];
                    
                    modelDatasets.push({
                        label: `ปี ${yr} (${dtStr})`,
                        data: dataPts,
                        backgroundColor: bgColor,
                        borderRadius: 4,
                        metaTotal: yearTotal
                    });
                });
            });

            // 3.3 Top Colors
            const overallColorGroup = groupBy(activeData, 'color');
            const topColorKeys = Object.keys(overallColorGroup)
                .map(k => ({ color: k, val: isSalesMetric ? overallColorGroup[k].sales : overallColorGroup[k].units }))
                .sort((a, b) => b.val - a.val)
                .slice(0, 10)
                .map(item => item.color);

            let colorDatasets = [];
            uniqueYears.forEach((yr, idx) => {
                dataTypesToShow.forEach(dtStr => {
                    const subData = activeData.filter(d => d.year === yr && d.dataType === dtStr);
                    const colorGroup = groupBy(subData, 'color');
                    const yearTotal = subData.reduce((sum, d) => sum + (isSalesMetric ? d.sales : d.units), 0);
                    
                    const dataPts = topColorKeys.map(c => colorGroup[c] ? (isSalesMetric ? colorGroup[c].sales : colorGroup[c].units) : 0);
                    let bgColor = dtStr === 'Delivery' ? lightPalette[idx % lightPalette.length] : colorPalette[idx % colorPalette.length];
                    
                    colorDatasets.push({
                        label: `ปี ${yr} (${dtStr})`,
                        data: dataPts,
                        backgroundColor: bgColor,
                        borderRadius: 4,
                        metaTotal: yearTotal
                    });
                });
            });

            // 4. Update Charts
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(trendCtx, {
                type: 'line',
                data: { labels: trendLabels, datasets: trendDatasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 20 } },
                    plugins: { 
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: {size: 10} } },
                        tooltip: { callbacks: { label: tooltipCallbackMultiLine } },
                        datalabels: {
                            display: function(context) {
                                const isDesktop = window.innerWidth > 768;
                                const isNotDaily = selectedTimeView !== 'daily';
                                const value = context.dataset.data[context.dataIndex];
                                return isDesktop && isNotDaily && value !== null && value !== 0;
                            },
                            align: 'top',
                            offset: 4,
                            color: function(context) { return context.dataset.borderColor; },
                            font: { size: 10, weight: 'bold' },
                            formatter: function(value) {
                                if(isSalesMetric) {
                                    if(value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                                    return (value / 1000).toFixed(0) + 'k';
                                } else {
                                    return new Intl.NumberFormat('th-TH').format(value);
                                }
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: {size: 10}, callback: v => isSalesMetric ? '฿' + (v/1000).toLocaleString() + 'k' : formatNum(v) } },
                        x: { ticks: { font: {size: 10}, maxTicksLimit: (selectedTimeView === 'daily') ? 15 : null } }
                    }
                }
            });

            const modelCtx = document.getElementById('modelChart').getContext('2d');
            if (modelChartInstance) modelChartInstance.destroy();
            modelChartInstance = new Chart(modelCtx, {
                type: 'bar',
                data: { labels: topModelKeys, datasets: modelDatasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: {size: 10} } },
                        tooltip: { callbacks: { label: tooltipCallbackBar } },
                        datalabels: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: {size: 10}, callback: v => isSalesMetric ? '฿' + (v/1000000).toLocaleString() + 'M' : formatNum(v) } },
                        x: { ticks: { font: {size: 9}, maxRotation: 45, minRotation: 45 } }
                    }
                }
            });

            const colorCtx = document.getElementById('colorChart').getContext('2d');
            if (colorChartInstance) colorChartInstance.destroy();
            colorChartInstance = new Chart(colorCtx, {
                type: 'bar',
                data: { labels: topColorKeys, datasets: colorDatasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { 
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: {size: 10} } },
                        tooltip: { callbacks: { label: tooltipCallbackBar } },
                        datalabels: { display: false }
                    },
                    scales: {
                        x: { beginAtZero: true, ticks: { font: {size: 10}, callback: v => isSalesMetric ? '฿' + (v/1000000).toLocaleString() + 'M' : formatNum(v) } },
                        y: { ticks: { font: {size: 10} } }
                    }
                }
            });
        };

        window.addEventListener('resize', () => {
            if (trendChartInstance) trendChartInstance.update();
        });

        document.getElementById('dataSourceFilter').addEventListener('change', updateDashboard);
        document.getElementById('yearFilter').addEventListener('change', updateDashboard);
        document.getElementById('metricFilter').addEventListener('change', updateDashboard);
        document.getElementById('timeViewFilter').addEventListener('change', updateDashboard);
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('dataSourceFilter').value = 'Both';
            document.getElementById('yearFilter').value = 'All';
            document.getElementById('timeViewFilter').value = 'monthly';
            document.getElementById('metricFilter').value = 'units';
            
            ['modelFilter', 'colorFilter'].forEach(id => {
                const sel = document.getElementById(id);
                Array.from(sel.options).forEach(opt => opt.selected = false);
                sel.options[0].selected = true;
            });

            updateDashboard();
        });

        updateDashboard();
    </script>
</body>
</html>
