<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP Sales & Delivery Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.05); }
        .checkbox-custom { width: 1.2rem; height: 1.2rem; border-radius: 0.25rem; border: 2px solid #4f46e5; cursor: pointer; }
    </style>
</head>
<body class="p-2 md:p-4 text-sm">
    <div class="max-w-7xl mx-auto space-y-4">
        <!-- Header -->
        <div class="glass-card rounded-xl p-3 flex flex-col lg:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold text-indigo-700"><i class="fas fa-sync-alt mr-2"></i>RP Sync Dashboard</h1>
                <span class="bg-indigo-100 text-indigo-700 text-[10px] px-2 py-0.5 rounded-full font-bold">SALE & DELIVERY</span>
            </div>
            
            <div class="flex flex-wrap gap-3 items-center bg-white p-2 rounded-lg border border-gray-100 shadow-sm">
                <div class="flex items-center gap-2 px-3 border-r border-gray-200">
                    <input type="checkbox" id="showSale" checked class="checkbox-custom">
                    <label for="showSale" class="font-bold text-indigo-600">ยอดขาย (Sale)</label>
                </div>
                <div class="flex items-center gap-2 px-3">
                    <input type="checkbox" id="showDel" checked class="checkbox-custom">
                    <label for="showDel" class="font-bold text-emerald-600">รับเข้า (Delivery)</label>
                </div>
                
                <select id="yearFilter" class="bg-gray-50 border text-xs rounded p-1.5 w-24">
                    <option value="All">All Years</option>
                    <option value="2567">2567</option>
                    <option value="2568">2568</option>
                    <option value="2569">2569</option>
                </select>
                
                <select id="timeViewFilter" class="bg-gray-50 border text-xs rounded p-1.5 w-28">
                    <option value="monthly" selected>Monthly</option>
                    <option value="weekly">Weekly</option>
                    <option value="daily">Daily</option>
                </select>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div id="cardSale" class="glass-card rounded-xl p-4 border-l-4 border-indigo-500 flex items-center justify-between transition-all">
                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase">ยอดขายรวม (Sale Units)</h3>
                    <p id="kpiSale" class="text-3xl font-extrabold text-indigo-700 mt-1">0</p>
                </div>
                <div class="text-indigo-200 text-3xl"><i class="fas fa-shopping-cart"></i></div>
            </div>
            <div id="cardDel" class="glass-card rounded-xl p-4 border-l-4 border-emerald-500 flex items-center justify-between transition-all">
                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase">ยอดรับเข้ารวม (Delivery Units)</h3>
                    <p id="kpiDel" class="text-3xl font-extrabold text-emerald-600 mt-1">0</p>
                </div>
                <div class="text-emerald-200 text-3xl"><i class="fas fa-truck-loading"></i></div>
            </div>
        </div>

        <!-- Main Trend -->
        <div class="glass-card rounded-xl p-4 shadow-sm">
            <h3 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2 flex justify-between items-center">
                <span><i class="fas fa-chart-line mr-2 text-indigo-500"></i>Sync Trend: Sale vs Delivery</span>
                <span id="trendLabel" class="text-[10px] text-gray-400">UNIT COMPARISON</span>
            </h3>
            <div class="relative h-80">
                <canvas id="syncChart"></canvas>
            </div>
        </div>

        <!-- Model Breakdown -->
        <div class="glass-card rounded-xl p-4 shadow-sm">
            <h3 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2">
                <i class="fas fa-motorcycle mr-2 text-orange-500"></i>Model Breakdown: Inventory Flow
            </h3>
            <div class="relative h-96">
                <canvas id="modelChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const rawData = []; // To be injected
        let syncChart = null;
        let modelChart = null;

        const updateDashboard = () => {
            const showSale = document.getElementById('showSale').checked;
            const showDel = document.getElementById('showDel').checked;
            const year = document.getElementById('yearFilter').value;
            const timeView = document.getElementById('timeViewFilter').value;

            // Visibility
            document.getElementById('cardSale').style.opacity = showSale ? '1' : '0.3';
            document.getElementById('cardDel').style.opacity = showDel ? '1' : '0.3';

            const filtered = rawData.filter(d => (year === 'All' || d.year === year));
            
            const saleData = filtered.filter(d => d.type === 'Sale');
            const delData = filtered.filter(d => d.type === 'Delivery');

            document.getElementById('kpiSale').innerText = saleData.reduce((s, d) => s + d.units, 0).toLocaleString() + ' คัน';
            document.getElementById('kpiDel').innerText = delData.reduce((s, d) => s + d.units, 0).toLocaleString() + ' คัน';

            // 1. Sync Trend Chart
            const periods = Array.from(new Set(filtered.map(d => d[timeView]))).sort();
            
            const datasets = [];
            if(showSale) {
                const data = periods.map(p => saleData.filter(d => d[timeView] === p).reduce((s, d) => s + d.units, 0));
                datasets.push({ label: 'Sale', data, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.1)', fill: true, tension: 0.3 });
            }
            if(showDel) {
                const data = periods.map(p => delData.filter(d => d[timeView] === p).reduce((s, d) => s + d.units, 0));
                datasets.push({ label: 'Delivery', data, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.3 });
            }

            if(syncChart) syncChart.destroy();
            syncChart = new Chart(document.getElementById('syncChart'), {
                type: 'line',
                data: { labels: periods, datasets },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
            });

            // 2. Model Chart
            const models = Array.from(new Set(filtered.map(d => d.model))).sort();
            const modelDatasets = [];
            if(showSale) {
                modelDatasets.push({ label: 'Sale', backgroundColor: '#6366f1', data: models.map(m => saleData.filter(d => d.model === m).reduce((s, d) => s + d.units, 0)) });
            }
            if(showDel) {
                modelDatasets.push({ label: 'Delivery', backgroundColor: '#10b981', data: models.map(m => delData.filter(d => d.model === m).reduce((s, d) => s + d.units, 0)) });
            }

            if(modelChart) modelChart.destroy();
            modelChart = new Chart(document.getElementById('modelChart'), {
                type: 'bar',
                data: { labels: models, datasets: modelDatasets },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
            });
        };

        ['showSale', 'showDel', 'yearFilter', 'timeViewFilter'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateDashboard);
        });

        // Initialize with data injected by python
        // updateDashboard(); // Will be called after data injection
    </script>
</body>
</html>
